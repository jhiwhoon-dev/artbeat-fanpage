name: Sync Videos

on:
  # 2026-11-09: 예약 실행이 시작되지 않아 스케줄 재등록을 위해 수정
  schedule:
    # 정각/30분은 GitHub 예약 실행이 몰려 지연되기 쉬워 어중간한 분으로 지정. 시각은 UTC(= KST - 9시간)
    - cron: '33 14,21,3,9 * * *'  # KST 23:33, 06:33, 12:33, 18:33
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼도 생김

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync full video catalog
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync_videos.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json src/data/view_history src/data/sync_meta.json
          git diff --cached --quiet || git commit -m "chore: 영상 목록/조회수 자동 동기화"
          git pull --rebase origin main
          git push
