name: Sync Videos

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 UTC 15:00 = 한국 시간 00:00
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼도 생김

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync full video catalog
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync_videos.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json src/data/view_history_*.json
          git diff --cached --quiet || git commit -m "chore: 영상 목록/조회수 자동 동기화"
          git pull --rebase origin main
          git push
