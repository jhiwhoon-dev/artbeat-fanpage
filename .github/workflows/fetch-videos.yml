name: Fetch New Videos

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 UTC 15:00 = 한국 시간 00:00
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼도 생김

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch new videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch_new_videos.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/videos.json; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git add src/data/videos.json
            git commit -m "chore: 신규 영상 자동 반영"
            git push
          fi
