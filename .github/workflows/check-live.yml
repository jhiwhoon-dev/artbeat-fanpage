name: Check Live Status

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check live status
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/check_live.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/live_status.json; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git add src/data/live_status.json
            git commit -m "chore: 라이브 상태 갱신"
            git push
          fi
