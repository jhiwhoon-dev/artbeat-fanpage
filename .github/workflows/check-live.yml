name: Check Live Status

# 자동 예약 실행은 중지함(search.list가 호출당 100유닛이라 API 할당량 부담이 큼).
# 필요할 때 GitHub 저장소의 Actions 탭 > Check Live Status > Run workflow 로 직접 실행.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check live status
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/check_live.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/live_status.json; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git add src/data/live_status.json
            git commit -m "chore: 라이브 상태 갱신"
            git push
          fi
