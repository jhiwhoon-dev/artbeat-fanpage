name: Fetch Channel Stats

on:
  # 2026-11-09: 예약 실행이 시작되지 않아 스케줄 재등록을 위해 수정
  schedule:
    - cron: "13 14 * * *" # 매일 UTC 14:13 = KST 23:13 (정각을 피해 지연을 줄이려는 시각, 다른 동기화와 10분 간격)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync channel stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync_channel_stats.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/channel.json src/data/subscriber_history.json
          git diff --cached --quiet || git commit -m "chore: 채널 통계 자동 동기화"
          git pull --rebase origin main
          git push
